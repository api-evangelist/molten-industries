description: Molten Industries is a West Oakland, California climate-technology company
  that uses methane pyrolysis to split natural gas into clean hydrogen and solid graphite
  using electrical resistive heating, consuming significantly less energy than conventional
  methods. Founded by Stanford researchers Kevin Bush and Caleb Boyd, the company produces
  US-made graphite for lithium-ion battery anodes and hydrogen for heavy industry. It is
  a hardware and materials manufacturer with no public developer API, SDK, or documentation
  surface; it is tracked in the API Evangelist network as a portfolio company of Union
  Square Ventures.
